# 엣지 함수 배포.
#
# 지금까지 엣지 함수를 전부 손으로 올렸다. 그래서 (1) 레포의 코드와 운영에
# 떠 있는 코드가 어긋나기 쉽고(실제로 exam-agent 는 몇 버전 뒤처져 있었다),
# (2) 누가 무엇을 언제 올렸는지 기록이 남지 않는다.
#
# main 에 병합되면 바뀐 함수만 배포한다. 특정 함수만 다시 올리고 싶으면
# Actions 탭에서 수동 실행(workflow_dispatch)하고 이름을 적는다.
#
# 필요한 것: 레포 시크릿 SUPABASE_ACCESS_TOKEN
#   Supabase 대시보드 → Account → Access Tokens 에서 발급해 넣는다.
#   프로젝트 ref 는 supabase/config.toml 의 project_id 를 그대로 읽는다.

name: deploy-functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      functions:
        description: '배포할 함수 이름(쉼표 구분). 비우면 바뀐 함수만.'
        required: false
        default: ''

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 바뀐 함수를 가리려면 직전 커밋이 필요하다
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 프로젝트 ref 읽기
        id: cfg
        run: |
          ref=$(grep -E '^project_id' supabase/config.toml | head -1 | cut -d'"' -f2)
          if [ -z "$ref" ]; then echo "::error::supabase/config.toml 에서 project_id 를 찾지 못했습니다"; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: 배포 대상 가리기
        id: pick
        run: |
          set -euo pipefail
          manual='${{ github.event.inputs.functions }}'
          if [ -n "$manual" ]; then
            list=$(echo "$manual" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -v '^$' | sort -u)
          else
            # _shared 가 바뀌면 그걸 import 하는 함수가 전부 영향을 받는다.
            changed=$(git diff --name-only HEAD^ HEAD -- supabase/functions/ || true)
            if echo "$changed" | grep -q '^supabase/functions/_shared/'; then
              echo "_shared 변경 — 전체 함수를 대상으로 합니다"
              list=$(ls -1 supabase/functions | grep -v '^_shared$' | sort -u)
            else
              list=$(echo "$changed" | sed -n 's#^supabase/functions/\([^/]*\)/.*#\1#p' \
                     | grep -v '^_shared$' | sort -u)
            fi
          fi
          if [ -z "$list" ]; then echo "배포할 함수가 없습니다"; fi
          echo "$list" > /tmp/fnlist
          echo "count=$(wc -l < /tmp/fnlist | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "대상:"; cat /tmp/fnlist

      - name: 배포
        if: steps.pick.outputs.count != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::레포 시크릿 SUPABASE_ACCESS_TOKEN 이 없습니다. Supabase 대시보드 → Account → Access Tokens 에서 발급해 등록하세요."
            exit 1
          fi
          fail=0
          while read -r fn; do
            [ -z "$fn" ] && continue
            [ -f "supabase/functions/$fn/index.ts" ] || { echo "::warning::$fn: index.ts 없음, 건너뜀"; continue; }
            echo "::group::deploy $fn"
            # verify_jwt 는 config.toml 에 적힌 함수만 끈다. CLI 가 config 를 읽는다.
            supabase functions deploy "$fn" --project-ref "${{ steps.cfg.outputs.ref }}" || fail=1
            echo "::endgroup::"
          done < /tmp/fnlist
          exit $fail
