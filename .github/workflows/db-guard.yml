name: db-guard

# 테넌트 경계 가드 (설계문서 §6.4).
# 마이그레이션을 빈 DB 에 전부 적용한 뒤, org_id 누락 / RLS 미적용 /
# search_path 안 잠근 SECURITY DEFINER 함수를 탐지해 하나라도 있으면 실패시킵니다.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/db-guard.sh'
      - '.github/workflows/db-guard.yml'
  workflow_dispatch:

jobs:
  tenancy-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 빈 DB 기동 + 마이그레이션 0001부터 전부 적용
        run: supabase db start

      - name: 테넌시 가드 실행
        run: ./scripts/db-guard.sh

      - name: RBAC 스모크 테스트 (테넌트 격리 · 권한 상승 차단)
        run: ./scripts/db-test.sh

      - name: 실패 시 DB 로그
        if: failure()
        run: supabase status || true
