<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 역량평가</title>
    <meta name="description" content="기업 채용·재직자 진단을 위한 AI 활용 역량평가">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <!-- 다크가 기본. 첫 페인트 전에 저장된 선호를 반영해 흰 화면 번쩍임을 막는다. -->
    <script>
      try {
        var t = localStorage.getItem('aiassess.theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
    <!-- 첫 화면 분기: 마케팅 도메인(ai-hrd.com / www) 루트는 소개 페이지로,
         제품 도메인(app.ai-hrd.com)은 그대로 앱으로. React 마운트 전에 실행돼 깜빡임이 없다.
         /landing 자체(path !== "/")에는 적용되지 않아 무한 루프가 없다. -->
    <script>
      try {
        var host = location.hostname;
        var isMarketing = (host === 'ai-hrd.com' || host === 'www.ai-hrd.com');
        var atRoot = (location.pathname === '/' || location.pathname === '');
        if (isMarketing && atRoot) location.replace('/landing');
      } catch (e) {}
    </script>
    
    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI 역량평가">
  <meta name="twitter:title" content="AI 역량평가">
  <meta property="og:description" content="기업 채용·재직자 진단을 위한 AI 활용 역량평가">
  <meta name="twitter:description" content="기업 채용·재직자 진단을 위한 AI 활용 역량평가">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <meta property="og:url" content="https://app.ai-hrd.com/">
  <meta property="og:image" content="https://ai-hrd.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://ai-hrd.com/og.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
