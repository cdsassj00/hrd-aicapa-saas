<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;
    background:radial-gradient(900px 520px at 78% -8%,rgba(10,132,255,.28),transparent 60%),
               radial-gradient(700px 500px at 8% 110%,rgba(123,92,255,.16),transparent 60%),#0a0b0d;
    color:#f3f5f8;position:relative;padding:76px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:14px}
  .logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#0a84ff,#7b5cff);
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff}
  .brand{font-size:22px;font-variation-settings:"wght" 700;letter-spacing:-.01em}
  .brand span{color:#8a94a3;font-variation-settings:"wght" 500;font-size:17px}
  .mid{margin-top:6px}
  .eyebrow{font-size:20px;color:#3ba0ff;font-variation-settings:"wght" 650;letter-spacing:.01em}
  h1{margin-top:20px;font-size:74px;line-height:1.08;letter-spacing:-.035em;font-variation-settings:"wght" 830}
  h1 .em{color:#3ba0ff}
  .sub{margin-top:26px;font-size:26px;color:#aab2be;line-height:1.5;max-width:940px}
  .chips{margin-top:30px;display:flex;gap:12px}
  .chip{border:1px solid #2d333d;border-radius:999px;padding:11px 20px;font-size:19px;color:#cdd4dd;font-variation-settings:"wght" 600}
  .bot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #232830;padding-top:24px}
  .org{font-size:21px;color:#cdd4dd;font-variation-settings:"wght" 650}
  .org b{color:#3ba0ff}
  .url{font-size:21px;color:#8a94a3;font-variation-settings:"wght" 600}
</style></head>
<body>
  <div class="top">
    <div class="logo">◈</div>
    <div class="brand">AI 역량평가 <span>&nbsp;for Business</span></div>
  </div>

  <div class="mid">
    <div class="eyebrow">채용을 위한 AI 활용 역량평가</div>
    <h1>“AI 잘 씁니다”를<br><span class="em">채용에서 검증</span>합니다.</h1>
    <div class="sub">지원자가 실제 업무를 생성형 AI로 어떻게 끝내는지 — 작업형 과제로 측정합니다.</div>
    <div class="chips">
      <div class="chip">문서·콘텐츠</div>
      <div class="chip">데이터 분석</div>
      <div class="chip">업무 자동화</div>
      <div class="chip">6축 역량 리포트</div>
    </div>
  </div>

  <div class="bot">
    <div class="org">한국데이터사이언티스트협회 <b>(CDSA)</b></div>
    <div class="url">ai-hrd.com</div>
  </div>
</body></html>
