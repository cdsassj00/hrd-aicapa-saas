# Supabase Auth 가 사용자 JWT 없이 직접 호출하는 훅이라 JWT 검증을 끈다.
# 대신 함수 안에서 Standard Webhooks 서명을 검증한다 — 안 그러면
# 누구나 이 URL 로 POST 해서 문자를 보낼 수 있다.
[functions.send-sms-hook]
verify_jwt = false

# exam-agent 는 함수 안에서 JWT 로 호출자 신원을 직접 확인하고(본인 세션인지,
# 진행 중인 시험인지) 거기에 맞춰 거절한다. 그래도 플랫폼 단에서 한 겹 더
# 막는 쪽이 낫다 — 토큰 없는 요청이 함수 본문에 닿을 이유가 없다.
[functions.exam-agent]
verify_jwt = true
